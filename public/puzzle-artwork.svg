<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Amber Accent Glow -->
    <radialGradient id="glowAmber" cx="30%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gold Text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Radial Glow Orbs -->
  <circle cx="400" cy="400" r="300" fill="url(#glowCyan)"/>
  <circle cx="250" cy="550" r="250" fill="url(#glowAmber)"/>

  <!-- Geometric Decorative Cyber Ring -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="20 10 5 10" opacity="0.7"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="40 15" opacity="0.6"/>
  <circle cx="400" cy="400" r="200" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5"/>

  <!-- Corner Brackets -->
  <path d="M 60 120 L 60 60 L 120 60" fill="none" stroke="#06b6d4" stroke-width="4"/>
  <path d="M 740 120 L 740 60 L 680 60" fill="none" stroke="#06b6d4" stroke-width="4"/>
  <path d="M 60 680 L 60 740 L 120 740" fill="none" stroke="#06b6d4" stroke-width="4"/>
  <path d="M 740 680 L 740 740 L 680 740" fill="none" stroke="#06b6d4" stroke-width="4"/>

  <!-- Central Hexagon Badge -->
  <polygon points="400,240 540,320 540,480 400,560 260,480 260,320" fill="#090d16" stroke="#06b6d4" stroke-width="5" opacity="0.9"/>

  <!-- Main Center Text -->
  <text x="400" y="380" font-family="'Orbitron', sans-serif" font-weight="900" font-size="76" text-anchor="middle" fill="url(#textGrad)" letter-spacing="4">
    CSCC
  </text>

  <text x="400" y="440" font-family="'Orbitron', sans-serif" font-weight="800" font-size="32" text-anchor="middle" fill="#ffffff" letter-spacing="8">
    CHALLENGE
  </text>

  <text x="400" y="490" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" text-anchor="middle" fill="#94a3b8" letter-spacing="3">
    WELCOME DAY 2026
  </text>

  <!-- Circuit Accent Dots & Lines -->
  <line x1="120" y1="400" x2="260" y2="400" stroke="#06b6d4" stroke-width="3" stroke-dasharray="10 5"/>
  <circle cx="120" cy="400" r="6" fill="#06b6d4"/>
  
  <line x1="540" y1="400" x2="680" y2="400" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 5"/>
  <circle cx="680" cy="400" r="6" fill="#f59e0b"/>

  <text x="400" y="710" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="14" text-anchor="middle" fill="#64748b" letter-spacing="2">
    DEVELOPMENT DEPARTMENT • REBUILD THE IMAGE
  </text>
</svg>

